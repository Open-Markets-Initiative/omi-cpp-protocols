name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C++23 compiler
        run: sudo apt-get update && sudo apt-get install -y g++-14
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=g++-14
      - name: Build
        run: cmake --build build --parallel
